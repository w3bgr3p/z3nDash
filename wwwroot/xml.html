<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML Viewer</title>
    <link rel="stylesheet" href="/css/themes.css">
    <script src="/js/theme.js"></script>
    <script src="/js/nav.js"></script>
    <link rel="stylesheet" href="/css/xml.css">
</head>
<body>

<div class="header">
    <div>
        <div class="header-title">XML Viewer</div>
        <div class="header-sub">Paste, drop or open a file — tree with search and collapse, like the JSON viewer</div>
    </div>
    <div class="header-right">
        <button class="btn sm" onclick="openFromDisk()">Open XML…</button>
        <button class="btn sm" onclick="formatInput()">Format</button>
        <button class="btn sm primary" onclick="parseXml()">Parse ▶</button>
    </div>
</div>

<div class="main">

    <!-- Left: raw XML -->
    <div class="panel" id="leftPanel">
        <div class="panel-header">
            <span class="panel-title">XML Input</span>
            <span class="panel-badge" id="inputBadge">paste XML</span>
            <div style="margin-left:auto;display:flex;gap:var(--sp-6)">
                <button class="btn sm" onclick="copyAll()">Copy</button>
                <button class="btn sm" onclick="clearAll()">Clear</button>
            </div>
        </div>
        <div class="panel-body" style="padding:0">
            <textarea class="xml-input" id="xmlInput" placeholder="Paste XML here, drop a file anywhere on the page, or Open XML…&#10;&#10;Parses as you type." spellcheck="false"></textarea>
        </div>
    </div>

    <div class="resizer" id="mainResizer"></div>

    <!-- Right: tree -->
    <div class="panel" id="rightPanel">
        <div class="panel-header">
            <span class="panel-title">Tree</span>
            <span class="panel-badge" id="outputBadge">0 rows</span>
            <div class="depth-row">
                <span class="depth-label">Depth</span>
                <button class="depth-btn" data-depth="1" onclick="expandToDepth(1)">1</button>
                <button class="depth-btn" data-depth="2" onclick="expandToDepth(2)">2</button>
                <button class="depth-btn active" data-depth="3" onclick="expandToDepth(3)">3</button>
                <button class="depth-btn" data-depth="5" onclick="expandToDepth(5)">5</button>
                <button class="btn sm" onclick="expandAll()">Expand all</button>
                <button class="btn sm" onclick="collapseAll()">Collapse all</button>
            </div>
            <input class="search-input" id="search" placeholder="Filter tags, attributes, text…" oninput="onSearch()">
            <span id="stats" class="stats-row"></span>
        </div>
        <div class="error-block" id="errorBlock"></div>
        <div class="vscroll-wrap" id="vscrollWrap">
            <div class="vscroll-spacer" id="vscrollSpacer"></div>
            <div class="vscroll-rows" id="vscrollRows"></div>
        </div>
    </div>

</div>

<script src="/js/xmlview.js"></script>
<script>
    // Разделитель панелей — ширина запоминается между визитами, как в json.html.
    (function () {
        var left = document.getElementById('leftPanel');
        var resizer = document.getElementById('mainResizer');
        var saved = parseInt(localStorage.getItem('xmlview-split') || '0', 10);
        if (saved > 100) left.style.flex = '0 0 ' + saved + 'px';
        var dragging = false;
        resizer.addEventListener('mousedown', function (e) { dragging = true; e.preventDefault(); });
        document.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            var rect = document.querySelector('.main').getBoundingClientRect();
            var w = Math.max(240, Math.min(rect.width - 240, e.clientX - rect.left));
            left.style.flex = '0 0 ' + w + 'px';
        });
        document.addEventListener('mouseup', function () {
            if (!dragging) return;
            dragging = false;
            localStorage.setItem('xmlview-split', left.getBoundingClientRect().width);
        });
    })();
</script>

</body>
</html>
