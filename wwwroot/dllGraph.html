<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>z3nDash | dllGraph</title>
    <link rel="stylesheet" href="/css/themes.css">
    <script src="/js/theme.js"></script>
    <script src="/js/nav.js"></script>
    <link rel="stylesheet" href="/css/dllgraph.css">
</head>
<body>
<div id="app">

    <div class="main-header">
        <h1>dllGraph</h1>
        <div class="header-right">
            <button class="btn" onclick="openInTab()" id="btnOpenTab" disabled>Open in tab</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="hidden" id="repoPath" />
        <button class="btn" id="btnPick" onclick="pickFile()">Choose DLL</button>
        <span id="fileLabel" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">No file selected</span>
        <button class="btn primary" id="btnGenerate" onclick="generate()">Generate</button>
        <div class="toolbar-sep"></div>
        <button class="btn" onclick="reload()" id="btnReload" disabled>Reload</button>
    </div>

    <div class="statusbar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">—</span>
    </div>

    <div class="graph-area">
        <iframe id="graphFrame" src="about:blank"></iframe>
        <div id="emptyState">
            <div class="empty-icon">⬡</div>
            <div class="empty-title">No graph loaded</div>
            <div class="empty-sub">Choose a DLL file and click Generate</div>
        </div>
    </div>

</div>
<script>
    var _generated = false;

    function setStatus(state, text) {
        var dot  = document.getElementById('statusDot');
        var txt  = document.getElementById('statusText');
        dot.className  = 'status-dot ' + (state || '');
        txt.className  = state || '';
        txt.textContent = text || '—';
    }

    async function pickFile() {
        var btn = document.getElementById('btnPick');
        btn.disabled = true;
        try {
            var res = await fetch('/dllGraph/pick?start=' + encodeURIComponent(document.getElementById('repoPath').value));
            var data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
            if (!data.path) return;
            document.getElementById('repoPath').value = data.path;
            document.getElementById('fileLabel').textContent = data.path;
            document.getElementById('fileLabel').title = data.path;
        } catch (e) {
            setStatus('err', e.message);
        } finally {
            btn.disabled = false;
        }
    }

    async function generate() {
        var repoPath = document.getElementById('repoPath').value.trim();
        if (!repoPath) { Dialog.error('Choose a DLL file first.'); return; }

        var btnG = document.getElementById('btnGenerate');
        btnG.disabled = true;
        setStatus('busy', 'Generating…');

        try {
            var res  = await fetch('/dllGraph/generate?repoPath=' + encodeURIComponent(repoPath), { method: 'POST' });
            var data = await res.json();

            if (!res.ok || data.error) {
                setStatus('err', data.error || ('HTTP ' + res.status));
                return;
            }

            setStatus('ok', 'Done — ' + (data.repoPath || repoPath));
            _generated = true;
            loadFrame();

        } catch (e) {
            setStatus('err', e.message);
        } finally {
            btnG.disabled = false;
        }
    }

    function loadFrame() {
        var frame  = document.getElementById('graphFrame');
        var empty  = document.getElementById('emptyState');
        var btnR   = document.getElementById('btnReload');
        var btnTab = document.getElementById('btnOpenTab');

        frame.src = '/dllGraph?' + Date.now();
        frame.className = 'visible';
        empty.className = 'hidden';
        btnR.disabled   = false;
        btnTab.disabled = false;
    }

    function reload() {
        if (!_generated) return;
        loadFrame();
    }

    function openInTab() {
        if (!_generated) return;
        window.open('/dllGraph', '_blank');
    }

</script>
</body>
</html>
